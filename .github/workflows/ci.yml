name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check lib/client.js
      - name: Client contract smoke test
        run: node test/smoke.mjs
      - name: Host unit tests
        run: node test/host.mjs
