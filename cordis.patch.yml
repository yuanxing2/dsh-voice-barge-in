# Hands-free voice input with barge-in and voiceprint.
# Requires the official experimental voice-input bundle for the local
# speech-to-text service and its API Remote:
#   @deepseek-ai/dsh-experimental-voice-input-bundle
- insert:
    - id: voice-barge-in
      name: dsh-voice-barge-in
      config:
        dataRoot: !!js dshHomePath('voiceprint')
